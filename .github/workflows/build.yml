name: build openwrt
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Initialization environment
      run: |
        sudo docker rmi `docker images -q`
        sudo apt-get -y update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
    - name: Clone source
      run: |
        git clone https://github.com/coolsnowwolf/lede
    - name: Setup feeds & Make config
      run: |
        cd lede
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp ../.config .
        make defconfig
    - name: Download package
      run: |
        cd lede
        make download -j8 || make download -j1 V=s
    - name: Compile firmware
      run: |
        cd lede
        make -j$(nproc) || make -j1 V=s
    - name: Upload firmware
      uses: actions/upload-artifact@master
      with:
        name: firmware
        path: lede/bin
